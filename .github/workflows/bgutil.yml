name: BgUtils POT Provider

on:
  push:
    branches:
      - main
    paths:
      - services/bgutil/**
  workflow_dispatch: null

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      service: bgutil
      tag_template: "{BGUTIL_VERSION}"
      image_name: bgutil-ytdlp-pot-provider
      add_latest: true
      upstream_repo: Brainicism/bgutil-ytdlp-pot-provider
      upstream_sparse_checkout: server
      build_context: upstream/server
