name: Build Container

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute Tag
        id: tag
        working-directory: services/${{ inputs.service }}
        run: |
          TAG=$(bash ./get-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        run: |
          echo "Successfully pushed: ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ steps.tag.outputs.tag }}"
